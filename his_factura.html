<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial Facturas</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E13C96',
            secondary: '#8AC440',
          }
        }
      }
    }
  </script>

  <!-- Iconos -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-['Inter',_sans-serif]">

<!-- NAVBAR -->
<div id="navbar"></div>

<main class="pt-28 px-4 pb-10 max-w-6xl mx-auto">

  <h2 class="text-2xl font-bold mb-6">Historial de Facturas</h2>

  <!-- =============================
       BUSCADOR + FECHA
  ============================== -->
  <div class="flex flex-col md:flex-row gap-3 mb-6">

    <input id="buscarNumero"
      placeholder="Buscar por número"
      class="p-2 border rounded-lg w-full md:w-1/3">

    <input id="buscarCliente"
      placeholder="Buscar por cliente"
      class="p-2 border rounded-lg w-full md:w-1/3">

    <input id="filtroFecha"
      type="date"
      class="p-2 border rounded-lg w-full md:w-1/3">

  </div>

  <!-- =============================
       FILTROS
  ============================== -->
  <div class="flex flex-wrap gap-2 mb-6">

    <button id="filtroTodos"
      class="px-3 py-1 border rounded-lg">
      Todos
    </button>

    <button id="filtroPendiente"
      class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-lg">
      Pendientes
    </button>

    <button id="filtroPagado"
      class="px-3 py-1 bg-green-100 text-green-700 rounded-lg">
      Pagadas
    </button>

    <button id="filtroAbonado"
      class="px-3 py-1 bg-blue-100 text-blue-700 rounded-lg">
      Abonadas
    </button>

  </div>

  <!-- =============================
       LISTA
  ============================== -->
  <div id="listaFacturas" class="space-y-4"></div>

</main>

<!-- =============================
     MODAL DETALLE
============================= -->
<div id="modalDetalle"
  class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

  <div class="bg-white p-6 rounded-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">

    <h3 class="text-xl font-semibold mb-4">Detalle Factura</h3>

    <div id="detalleContenido"></div>

    <div class="text-right mt-4">
      <button id="cerrarDetalle"
        class="border px-4 py-2 rounded-lg">
        Cerrar
      </button>
    </div>

  </div>
</div>

<!-- =============================
     PDF REAL (MISMO ESTILO FACTURA)
============================= -->
<div id="pdfContainer" class="hidden">

<div id="facturaPDFHistorial"
  class="bg-white text-gray-800 p-6 w-full max-w-[700px] mx-auto">

    <h2 class="text-2xl font-bold mb-6">
      Factura #<span id="pdfNumero"></span>
    </h2>

    <!-- INFO -->
    <div class="mb-4">
      <p><strong>Cliente:</strong> <span id="pdfCliente"></span></p>
      <p><strong>Tipo:</strong> <span id="pdfTipo"></span></p>
      <p><strong>Estado:</strong> <span id="pdfEstado"></span></p>
      <p><strong>Fecha:</strong> <span id="pdfFecha"></span></p>
    </div>

    <!-- TABLA -->
    <table class="w-full text-sm border-collapse">

      <thead>
        <tr class="bg-gray-100 border-b text-left">
          <th class="p-2">Categoría</th>
          <th class="p-2">Producto</th>
          <th class="p-2">Descripción</th>
          <th class="p-2">Cantidad</th>
          <th class="p-2">Precio</th>
          <th class="p-2">Subtotal</th>
        </tr>
      </thead>

      <tbody id="pdfDetalle"></tbody>

    </table>

    <!-- TOTAL -->
    <div class="text-right mt-6">
      <p class="text-xl font-bold">
        Total: C$ <span id="pdfTotal"></span>
      </p>
    </div>

  </div>

</div>

<!-- =============================
     NAVBAR SCRIPT
============================= -->
<script>
fetch('components/navbar.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('navbar').innerHTML = data;

    lucide.createIcons();

    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('mobileMenu');

    if (btn && menu) {
      btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
        menu.classList.toggle('flex');
      });
    }
  });
</script>

<!-- JS -->
<script type="module" src="js/his_factura.js"></script>

</body>
</html>
