<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Factura</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#E13C96',
            secondary: '#8AC440',
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-800">

<div id="navbar"></div>

<main class="pt-28 px-4 pb-10 max-w-5xl mx-auto">

  <div id="facturaPDF">

    <h2 class="text-2xl font-bold mb-6">Nueva Factura</h2>

    <!-- ================= CLIENTE ================= -->
    <div class="mb-4 relative">
      <label class="block mb-1 font-medium">Cliente</label>

      <button type="button" id="clienteBtn"
        class="w-full flex justify-between items-center p-3 border rounded-lg bg-white shadow-sm">

        <span id="clienteText" class="text-gray-500">Selecciona cliente</span>
        <i data-lucide="chevron-down"></i>
      </button>

      <div id="clienteList"
        class="hidden absolute z-50 mt-2 w-full bg-white border rounded-lg shadow-lg max-h-60 overflow-y-auto">
      </div>

      <input type="hidden" id="clienteSelect">
    </div>

    <!-- ================= TIPO (IGUAL CLIENTE) ================= -->
    <div class="mb-4 relative">
      <label class="block mb-1 font-medium">Tipo</label>

      <button type="button" id="tipoBtn"
        class="w-full flex justify-between items-center p-3 border rounded-lg bg-white shadow-sm">

        <span id="tipoText" class="text-gray-500">Selecciona tipo</span>
        <i data-lucide="chevron-down"></i>
      </button>

      <div id="tipoList"
        class="hidden absolute z-50 mt-2 w-full bg-white border rounded-lg shadow-lg overflow-hidden">

        <div class="p-3 hover:bg-gray-100 cursor-pointer" data-value="contado">
          Contado
        </div>

        <div class="p-3 hover:bg-gray-100 cursor-pointer" data-value="credito">
          Crédito
        </div>

      </div>

      <input type="hidden" id="tipo">
    </div>

    <!-- ================= PRODUCTOS ================= -->
    <div class="bg-white p-4 rounded-xl shadow mb-4">

      <!-- TABLA (DESKTOP) -->
      <div id="tablaProductosContainer" class="overflow-x-auto relative">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left border-b bg-gray-100">
              <th class="p-2">Producto</th>
              <th class="p-2">Descripción</th>
              <th class="p-2">Cantidad</th>
              <th class="p-2">Precio</th>
              <th class="p-2">Total</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productosTable"></tbody>
        </table>
      </div>

      <h3 id="tituloProductosMobile"
      class="hidden text-lg font-semibold mb-2">
      Productos
     </h3>

      <!-- CARDS (MOBILE) -->
       
      <div id="cardsProductosContainer" class="hidden space-y-3"></div>

      <button id="addProducto"
        class="mt-3 text-primary flex items-center gap-1">
        <i data-lucide="plus"></i>
        Agregar producto
      </button>

    </div>

    <!-- TOTAL -->
    <div class="text-right mb-6">
      <p class="text-xl font-bold">
        Total: C$ <span id="total">0.00</span>
      </p>
    </div>

  </div>

  <button id="guardarFactura"
    class="bg-primary text-white px-6 py-3 rounded-xl shadow">
    Guardar
  </button>

</main>

<!-- MODAL -->
<div id="modalSuccess"
  class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">

  <div class="bg-white p-6 rounded-xl w-full max-w-sm text-center">

    <i data-lucide="check-circle" class="text-green-500 w-10 h-10 mx-auto mb-2"></i>

    <h3 class="text-lg font-semibold mb-2">Factura guardada</h3>

    <p class="text-sm text-gray-500 mb-4">¿Descargar PDF?</p>

    <div class="flex justify-center gap-3">
      <button id="descargarDesdeModal"
        class="bg-secondary text-white px-4 py-2 rounded-lg">
        Descargar
      </button>

      <button id="cerrarModalSuccess"
        class="border px-4 py-2 rounded-lg">
        Cancelar
      </button>
    </div>

  </div>
</div>

<script type="module" src="js/factura.js"></script>

<!-- =============================
     NAVBAR SCRIPT
============================= -->
<script>
fetch('components/navbar.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('navbar').innerHTML = data;

    lucide.createIcons();

    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('mobileMenu');

    if (btn && menu) {
      btn.addEventListener('click', () => {
        menu.classList.toggle('hidden');
        menu.classList.toggle('flex');
      });
    }
  });
</script>

</body>
</html>
